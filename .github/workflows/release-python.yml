# Publishes `itaja` on PyPI on a `python-vX.Y.Z` tag, only after the full CI passes.
#
# No token: PyPI trusted publishing (OIDC). The publisher configured on pypi.org is
# repository itaja/itaja-sdks, workflow release-python.yml, environment `pypi`.
name: release-python

on:
  push:
    tags: ["python-v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-python.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The tag matches the package version
        run: |
          version="${GITHUB_REF_NAME#python-v}"
          grep -q "^version = \"$version\"$" pyproject.toml
          grep -q "SDK_VERSION = \"$version\"" src/itaja/_version.py
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/itaja/
    permissions:
      id-token: write # trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
