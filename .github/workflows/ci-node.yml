name: ci-node

on:
  push:
    branches: [main]
    paths: ["packages/node/**", "spec/**", ".github/workflows/ci-node.yml"]
  pull_request:
    paths: ["packages/node/**", "spec/**", ".github/workflows/ci-node.yml"]
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/node

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: packages/node/package.json
      # pnpm 11 itself needs Node >= 22.13: install and build with 22…
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The generated types must match spec/openapi.json.
      - run: pnpm generate:check
      - run: pnpm typecheck
      - run: pnpm build
      # …then run the suite and the built package on the Node the matrix targets.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --version && ./node_modules/.bin/vitest run
      - run: node dist/cli.js help
