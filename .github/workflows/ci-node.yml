name: ci-node

on:
  push:
    branches: [main]
    paths: ["packages/node/**", "spec/**", ".github/workflows/ci-node.yml"]
  pull_request:
    paths: ["packages/node/**", "spec/**", ".github/workflows/ci-node.yml"]
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/node

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: packages/node/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: packages/node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # The generated types must match spec/openapi.json.
      - run: pnpm generate:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
