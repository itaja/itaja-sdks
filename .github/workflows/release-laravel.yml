# Releases itaja/itaja-laravel on a `laravel-vX.Y.Z` tag, only after the full CI passes.
#
# Packagist reads a composer.json at the ROOT of a repository, and this one lives in
# packages/laravel. So the release splits that folder (with its history) into the
# read-only mirror itaja/itaja-laravel, tags the mirror `vX.Y.Z`, and asks Packagist to
# re-read it. Nobody ever edits the mirror by hand.
#
# Needs: the public repository itaja/itaja-laravel, a deploy key with write access on it
# (secret LARAVEL_MIRROR_DEPLOY_KEY), and the secrets PACKAGIST_USERNAME / PACKAGIST_TOKEN.
name: release-laravel

on:
  push:
    tags: ["laravel-v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-laravel.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    env:
      MIRROR: itaja/itaja-laravel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version of the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#laravel-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The constant the SDK sends in `x-itaja-client` must match the tag.
          grep -q "SDK = '$version'" packages/laravel/src/Version.php

      - name: Split packages/laravel into its own history
        run: |
          git config user.name "itaja-sdks release"
          git config user.email "sdks@getitaja.com"
          git subtree split --prefix=packages/laravel --branch laravel-split

      - name: Push the split and the tag to the mirror
        env:
          DEPLOY_KEY: ${{ secrets.LARAVEL_MIRROR_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/mirror_key
          chmod 600 ~/.ssh/mirror_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mirror_key -o IdentitiesOnly=yes"
          git remote add mirror "git@github.com:${MIRROR}.git"
          git push mirror laravel-split:refs/heads/main --force-with-lease
          git tag "v${{ steps.version.outputs.version }}" laravel-split
          git push mirror "refs/tags/v${{ steps.version.outputs.version }}"

      - name: Ask Packagist to re-read the mirror
        env:
          PACKAGIST_USERNAME: ${{ secrets.PACKAGIST_USERNAME }}
          PACKAGIST_TOKEN: ${{ secrets.PACKAGIST_TOKEN }}
        run: |
          curl --fail-with-body -sS -X POST "https://packagist.org/api/update-package?username=${PACKAGIST_USERNAME}&apiToken=${PACKAGIST_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"repository\":{\"url\":\"https://github.com/${MIRROR}\"}}"
