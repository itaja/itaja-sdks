name: ci-laravel

on:
  push:
    branches: [main]
    paths: ["packages/laravel/**", "composer.json", "spec/**", ".github/workflows/ci-laravel.yml"]
  pull_request:
    paths: ["packages/laravel/**", "composer.json", "spec/**", ".github/workflows/ci-laravel.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Laravel 12 needs PHP 8.2+, Laravel 13 needs 8.3+. Laravel 11 is not supported:
        # every 11.x release carries a security advisory Composer refuses to install.
        php: ["8.2", "8.3", "8.4"]
        laravel: ["12.*", "13.*"]
        exclude:
          - { php: "8.2", laravel: "13.*" }
        include:
          - { php: "8.5", laravel: "13.*" }
    name: php ${{ matrix.php }} · laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Pin the Laravel major
        run: |
          composer require --no-interaction --no-update --dev "laravel/framework:${{ matrix.laravel }}"
          composer update --no-interaction --prefer-dist --with-all-dependencies
      - run: composer validate --strict
      - run: composer test
