# Stages @itaja/node on a `node-vX.Y.Z` tag, and only after the full CI passes.
#
# npm removes direct publishing with tokens in January 2027: the workflow runs
# `npm stage publish`, and a maintainer promotes the staged version with 2FA
# (`npm stage list`, then `npm stage approve <stage-id> --otp <code>`). Nothing
# reaches the registry without that approval.
name: release-node

on:
  push:
    tags: ["node-v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci-node.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/node
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: packages/node/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/node/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      # Staged publishing needs npm >= 11.15 (Node 22 ships npm 10).
      - run: npm install -g npm@^11.15.0 && npm --version
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json
        run: test "node-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm build
      - name: Stage the version (a maintainer approves it with 2FA)
        # No token: npm trusted publishing (OIDC) authenticates this workflow.
        run: npm stage publish --provenance --access public
