[project]
name = "itaja"
version = "0.1.0"
description = "Itaja for Python servers: declare what you sell in code, push it, mount one webhook route, react to typed events. Django, FastAPI, Flask."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "LIXALI STUDIO" }]
keywords = ["itaja", "payments", "subscriptions", "credits", "licenses", "webhooks", "django", "fastapi", "flask"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Django",
  "Framework :: FastAPI",
  "Framework :: Flask",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
django = ["django>=4.2"]
fastapi = ["fastapi>=0.110"]
starlette = ["starlette>=0.37"]
flask = ["flask>=3.0"]

[project.scripts]
itaja = "itaja.cli:main"

[project.urls]
Homepage = "https://github.com/itaja/itaja-sdks/tree/main/packages/python"
Issues = "https://github.com/itaja/itaja-sdks/issues"
Source = "https://github.com/itaja/itaja-sdks/tree/main/packages/python"

[dependency-groups]
dev = [
  "django>=4.2",
  "fastapi>=0.110",
  "flask>=3.0",
  "httpx2>=2.14",
  "jsonschema>=4.23",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/itaja"]

[tool.hatch.build.targets.sdist]
only-include = ["src/itaja", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

[[tool.mypy.overrides]]
module = ["django.*", "flask.*", "starlette.*", "fastapi.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
